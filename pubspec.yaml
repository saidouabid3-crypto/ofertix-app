name: ofertix
description: AI deals and price comparison app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # =========================
  # UI
  # =========================
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  lottie: ^3.1.2
  glassmorphism: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.2.0

  # TikTok / Reels style feed
  preload_page_view: ^0.2.0
  visibility_detector: ^0.4.0+2

  # =========================
  # STATE MANAGEMENT
  # =========================
  provider: ^6.1.5+1

  # =========================
  # FIREBASE
  # =========================
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.2.1

  # =========================
  # STORAGE
  # =========================
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # =========================
  # NETWORK
  # =========================
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # =========================
  # LOCATION
  # =========================
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # =========================
  # SCANNER
  # =========================
  mobile_scanner: ^6.0.10

  # =========================
  # AI VOICE
  # =========================
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # =========================
  # MEDIA / VIDEO FEED
  # =========================
  webview_flutter: ^4.10.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_compress: ^3.1.4
  cached_video_player_plus: 4.1.0
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  # =========================
  # SEARCH
  # =========================
  flutter_typeahead: ^5.2.0

  # =========================
  # NOTIFICATIONS
  # =========================
  flutter_local_notifications: ^17.2.1

  # =========================
  # URLS / SHARE
  # =========================
  url_launcher: ^6.3.1
  share_plus: ^12.0.2

  # =========================
  # ENV
  # =========================
  flutter_dotenv: ^6.0.1

  # =========================
  # LOCALIZATION
  # =========================
  easy_localization: ^3.0.8

  # =========================
  # CHARTS
  # =========================
  fl_chart: ^0.69.0

  # =========================
  # ICONS
  # =========================
  font_awesome_flutter: ^10.8.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/lang/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/logo.png"

  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/images/logo.png"